<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InferencePulse</title>

<style>
:root {
  color-scheme: dark;
  --bg:#090b10;
  --card:#121620;
  --border:#252b38;
  --text:#f5f7fb;
  --muted:#8f9bad;
  --green:#38d996;
  --yellow:#f4c95d;
  --red:#ff6678;
  --blue:#6ea8ff;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

main {
  width:min(1150px,calc(100% - 32px));
  margin:auto;
  padding:64px 0;
}

h1 {
  margin:0;
  font-size:clamp(40px,7vw,68px);
  letter-spacing:-.05em;
}

.subtitle {
  margin:12px 0 36px;
  color:var(--muted);
}

.overall,
.card {
  border:1px solid var(--border);
  background:var(--card);
  border-radius:15px;
}

.overall {
  padding:18px 22px;
  margin-bottom:16px;
  font-weight:800;
}

.grid {
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
}

.card {
  padding:20px;
}

.head,
.row {
  display:flex;
  justify-content:space-between;
  gap:14px;
}

.name {
  font-weight:850;
  font-size:18px;
}

.status {
  text-transform:uppercase;
  font-size:11px;
  font-weight:900;
  letter-spacing:.08em;
}

.up { color:var(--green); }
.rate_limited,
.degraded { color:var(--yellow); }
.down,
.timeout,
.auth_error { color:var(--red); }

.big {
  margin-top:22px;
  font-size:34px;
  font-weight:900;
}

.muted,
.row span {
  color:var(--muted);
  font-size:13px;
}

.row {
  margin-top:12px;
}

code {
  display:block;
  margin-top:18px;
  color:var(--blue);
  overflow-wrap:anywhere;
  font-size:12px;
}

footer {
  margin-top:32px;
  color:var(--muted);
  font-size:12px;
}
</style>
</head>

<body>
<main>

<h1>InferencePulse</h1>

<div class="subtitle">
  Minute-resolution availability monitoring for free
  GLM-5.3-Flash inference.
</div>

<div class="overall" id="overall">
  Loading…
</div>

<div class="grid" id="grid"></div>

<footer id="footer"></footer>

</main>

<script>
const e = x =>
  String(x ?? "—")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");

async function load() {

  const stamp = Date.now();

  const [cr,sr] =
    await Promise.all([
      fetch(
        `data/current.json?${stamp}`
      ),
      fetch(
        `data/summary.json?${stamp}`
      )
    ]);

  const current =
    await cr.json();

  const summary =
    await sr.json();

  const ids =
    Object.keys(
      summary.providers || {}
    );

  const up =
    ids.filter(
      id =>
        current.providers?.[id]
          ?.status === "up"
    ).length;

  document.querySelector(
    "#overall"
  ).innerHTML =
    `<span class="${
      up === ids.length
        ? "up"
        : "degraded"
    }">${up}/${ids.length} currently up</span>`;


  document.querySelector(
    "#grid"
  ).innerHTML =
    ids.map(id => {

      const s =
        summary.providers[id];

      const c =
        current.providers?.[id] || {};

      return `
      <section class="card">

        <div class="head">
          <div class="name">
            ${e(s.name)}
          </div>

          <div class="status ${e(c.status)}">
            ${e(
              (c.status || "unknown")
                .replaceAll("_"," ")
            )}
          </div>
        </div>

        <div class="big">
          ${
            s.success_pct == null
              ? "—"
              : e(s.success_pct + "%")
          }
        </div>

        <div class="muted">
          successful inference · last 24h
        </div>

        <div class="row">
          <span>Latest latency</span>
          <strong>
            ${
              c.latency_ms == null
                ? "—"
                : e(c.latency_ms + " ms")
            }
          </strong>
        </div>

        <div class="row">
          <span>Median</span>
          <strong>
            ${
              s.median_latency_ms == null
                ? "—"
                : e(
                    s.median_latency_ms
                    + " ms"
                  )
            }
          </strong>
        </div>

        <div class="row">
          <span>P95</span>
          <strong>
            ${
              s.p95_latency_ms == null
                ? "—"
                : e(
                    s.p95_latency_ms
                    + " ms"
                  )
            }
          </strong>
        </div>

        <div class="row">
          <span>Minute coverage</span>
          <strong>
            ${e(s.coverage_pct + "%")}
          </strong>
        </div>

        <div class="row">
          <span>Rate limited</span>
          <strong>
            ${e(s.rate_limited_checks)}
          </strong>
        </div>

        <code>${e(s.model)}</code>

      </section>`;
    })
    .join("");


  document.querySelector(
    "#footer"
  ).textContent =
    "Updated " +
    new Date(
      current.generated_at
    ).toLocaleString();
}

load();

setInterval(
  load,
  60_000
);
</script>

</body>
</html>
