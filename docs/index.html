<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>InferencePulse</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--card:#111620;--card2:#0d1119;--border:#252d3b;--text:#f5f7fb;--muted:#8d99aa;--green:#3dde9d;--yellow:#f1c75b;--red:#ff6678;--blue:#72a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
main{width:min(1240px,calc(100% - 28px));margin:auto;padding:48px 0 80px}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.05em;margin:0}.subtitle{color:var(--muted);font-size:16px;margin:8px 0 28px}
.hero,.provider{border:1px solid var(--border);background:var(--card);border-radius:16px}.hero{padding:28px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:11px;font-weight:800}.hero-num{font-size:clamp(64px,12vw,112px);line-height:.95;font-weight:900;letter-spacing:-.06em;margin:10px 0}.hero-sub{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}.mini{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card2)}.mini strong{display:block;font-size:28px;margin-top:5px}
.provider{margin:18px 0;overflow:hidden}.head{padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px}.head h2{margin:0;font-size:24px}.qph{font-size:40px;font-weight:900}.meta{color:var(--muted);margin-top:5px}.pass,.up{color:var(--green)}.fail,.timeout,.down,.auth_error{color:var(--red)}.rate_limited,.degraded{color:var(--yellow)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.metric{background:var(--card2);padding:14px}.metric b{display:block;font-size:19px;margin-top:4px}
.slos,.timeline{padding:18px 22px}.slo{display:grid;grid-template-columns:1.4fr 1fr 1fr 70px;gap:12px;padding:9px 0;border-bottom:1px solid #202735}.bars{display:flex;height:30px;gap:1px;margin-top:10px}.bar{flex:1;min-width:1px}.bar.up{background:var(--green)}.bar.rate_limited{background:var(--yellow)}.bar.timeout,.bar.down,.bar.auth_error,.bar.error{background:var(--red)}.bar.degraded{background:#df9b45}
details{border-top:1px solid var(--border)}summary{cursor:pointer;padding:16px 22px;font-weight:800}.body{padding:0 22px 20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:9px;border-bottom:1px solid #202735;font-variant-numeric:tabular-nums}th{color:var(--muted);font-size:11px;text-transform:uppercase}.note,footer{color:var(--muted);font-size:12px}footer{margin-top:28px}
@media(max-width:650px){.head{grid-template-columns:1fr}.slo{grid-template-columns:1fr 1fr}}
</style></head><body><main>
<h1>InferencePulse</h1>
<div class="subtitle">Reliable free GLM-5.3-Flash capacity, audited against rate-limit and availability objectives.</div>
<section class="hero"><div class="eyebrow">Predicted reliable requests / hour</div><div class="hero-num" id="headline">—</div><div class="hero-sub" id="heroSub"></div></section>
<div class="grid" id="capacity"></div><div id="providers"></div><footer id="footer"></footer>
</main><script>
const e=x=>String(x??"—").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const n=x=>x==null?"—":Number(x).toLocaleString(undefined,{maximumFractionDigits:2});
const dur=s=>s==null?"—":s<120?s+"s":s<7200?Math.round(s/60)+"m":(s/3600).toFixed(1)+"h";
function timeline(rows){const a=rows.slice(-240);return a.length?'<div class="bars">'+a.map(r=>`<i class="bar ${e(r.status)}" title="${e(r.ts)} · ${e(r.status)} · HTTP ${e(r.http)}"></i>`).join("")+'</div>':'<p class="note">No history yet.</p>'}
function incidents(x,label){const a=x.incidents||[];return `<p><b>${label}</b> · ${n(x.count)} incidents · median ${dur(x.median_duration_seconds)} · P95 ${dur(x.p95_duration_seconds)} · longest ${dur(x.longest_duration_seconds)}</p>`+(a.length?`<table><thead><tr><th>Start</th><th>End</th><th>Duration</th><th>Checks</th></tr></thead><tbody>${a.slice().reverse().map(i=>`<tr><td>${e(i.start)}</td><td>${e(i.end)}</td><td>${dur(i.duration_seconds)}</td><td>${n(i.checks)}</td></tr>`).join("")}</tbody></table>`:"")}
function card(id,s,m,h){const labels={success:"Successful requests",rate_limit:"Rate limited",timeout:"Timeouts",p95_latency:"P95 latency"};const slos=Object.entries(s.slo).map(([k,v])=>`<div class="slo"><span>${labels[k]}</span><span>Target ${e(v.target)}</span><span>Observed ${n(v.actual)}${k==="p95_latency"?" ms":"%"}</span><b class="${v.pass?"pass":"fail"}">${v.pass?"PASS":"FAIL"}</b></div>`).join("");return `<section class="provider"><div class="head"><div><h2>${e(s.name)} <span class="${s.meets_slo?"pass":"fail"}">${s.meets_slo?"SLO PASS":"SLO FAIL"}</span></h2><div class="meta">${e(s.model)} · ${e(s.objective.label)} · ${e(s.objective.source)} objective</div></div><div><div class="eyebrow">Predicted reliable QPH</div><div class="qph">${n(s.predicted_reliable_qph)}</div><div class="${e(s.current_status)}">${e(s.current_status)} now</div></div></div><div class="metrics"><div class="metric"><span class="eyebrow">Tested load</span><b>${n(s.tested_qph)}/h</b></div><div class="metric"><span class="eyebrow">All-time success</span><b>${n(s.all_time_success_pct)}%</b></div><div class="metric"><span class="eyebrow">429</span><b>${n(s.all_time_429_pct)}%</b></div><div class="metric"><span class="eyebrow">Timeout</span><b>${n(s.all_time_timeout_pct)}%</b></div><div class="metric"><span class="eyebrow">P95 latency</span><b>${n(s.all_time_p95_latency_ms)} ms</b></div><div class="metric"><span class="eyebrow">Evidence</span><b>${n(s.all_time_checks)}</b></div></div><div class="slos"><div class="eyebrow">Service-level objectives · all retained history</div>${slos}</div><div class="timeline"><div class="eyebrow">Recent observations</div>${timeline(m)}</div><details><summary>Rate-limit incident history (${n(s.rate_limit_incidents.count)})</summary><div class="body">${incidents(s.rate_limit_incidents,"HTTP 429")}</div></details><details><summary>Timeout incident history (${n(s.timeout_incidents.count)})</summary><div class="body">${incidents(s.timeout_incidents,"Timeout")}</div></details><details><summary>Hourly capacity history</summary><div class="body"><table><thead><tr><th>Hour</th><th>Attempts</th><th>Success</th><th>429</th><th>Timeout</th><th>Predicted reliable QPH</th><th>SLO</th></tr></thead><tbody>${h.slice().reverse().map(x=>`<tr><td>${e(x.hour)}</td><td>${n(x.attempts)}</td><td>${n(x.successes)}</td><td>${n(x.rate_limited)}</td><td>${n(x.timeouts)}</td><td>${n(x.predicted_reliable_qph)}</td><td class="${x.meets_slo?"pass":"fail"}">${x.meets_slo?"PASS":"FAIL"}</td></tr>`).join("")}</tbody></table></div></details><details><summary>Every historical measurement (${m.length})</summary><div class="body"><table><thead><tr><th>Time</th><th>Status</th><th>HTTP</th><th>Latency</th><th>Retry-after</th><th>Remaining</th><th>Run</th></tr></thead><tbody>${m.slice().reverse().map(r=>`<tr><td>${e(r.ts)}</td><td class="${e(r.status)}">${e(r.status)}</td><td>${e(r.http)}</td><td>${n(r.latency_ms)} ms</td><td>${e(r.retry_after)}</td><td>${e(r.rate_limit_remaining)}</td><td>${e(r.run_id)}</td></tr>`).join("")}</tbody></table></div></details></section>`}
async function load(){const t=Date.now();const [s,m,h]=await Promise.all([fetch(`data/summary.json?${t}`).then(r=>r.json()),fetch(`data/measurements.json?${t}`).then(r=>r.json()),fetch(`data/hourly.json?${t}`).then(r=>r.json())]);document.querySelector("#headline").textContent=n(s.headline.predicted_reliable_qph);document.querySelector("#heroSub").innerHTML=`<span><b>${s.headline.providers_meeting_slo}/${s.headline.provider_count}</b> providers meet SLO</span><span><b>${n(s.headline.historical_measurements)}</b> historical measurements</span>`;document.querySelector("#capacity").innerHTML=Object.entries(s.providers).map(([id,p])=>`<div class="mini"><span class="eyebrow">${e(p.name)}</span><strong>${n(p.predicted_reliable_qph)} req/h</strong><span class="${p.meets_slo?"pass":"fail"}">${p.meets_slo?"MEETS SLO":"FAILS SLO"}</span></div>`).join("");document.querySelector("#providers").innerHTML=Object.entries(s.providers).map(([id,p])=>card(id,p,m.providers[id]||[],h.providers[id]||[])).join("");document.querySelector("#footer").textContent="Updated "+new Date(s.generated_at).toLocaleString()+" · SLO thresholds are InferencePulse objectives unless the provider objective is marked published."}
load();setInterval(load,60000);
</script></body></html>
