name: InferencePulse

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions schedules at 5-minute granularity.
    # One runner remains alive for five 1-minute observations.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read


# ============================================================
# IMPORTANT:
#
# DO NOT put workflow-level concurrency here.
#
# We WANT probe jobs from separate scheduled runs to overlap.
#
# Only the publish job is serialized below.
# ============================================================


jobs:

  # ==========================================================
  # PROBE
  #
  # Each workflow run:
  #   - checks all four providers in parallel
  #   - once per minute
  #   - for 8 minutes
  #   - writes ONE unique shard
  #   - uploads shard as artifact
  #
  # Multiple probe jobs are intentionally allowed to overlap.
  # ==========================================================

  probe:
    name: Probe inference servers
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run redundant minute heartbeats
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          mkdir -p pulse-output

          cat > /tmp/inferencepulse_probe.py <<'PY'
          import os
          import json
          import time
          import tempfile
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed


          # ============================================================
          # SETTINGS
          # ============================================================

          # Five observations:
          #
          # minute 0
          # minute 1
          # ...
          # minute 4
          #
          # This intentionally overlaps subsequent scheduled runners.
          CYCLES = 5
          PERIOD_SECONDS = 60

          CONNECT_TIMEOUT = 10

          # We learned NVIDIA can hang indefinitely.
          # Don't let one bad NVIDIA probe block a minute forever.
          REQUEST_TIMEOUT = 25

          OUTPUT = Path("pulse-output/shard.jsonl")


          PROVIDERS = [
              {
                  "id": "aihubmix",
                  "name": "AIHubMix",
                  "url": "https://aihubmix.com/v1/chat/completions",
                  "model": "coding-glm-5.3-flash-free",
                  "key": os.environ.get("AIHUBMIX_API_KEY", ""),
              },

              {
                  "id": "unorouter",
                  "name": "UnoRouter",
                  "url": "https://api.unorouter.com/v1/chat/completions",
                  "model": "glm-5.3-flash:free",
                  "key": os.environ.get("UNOROUTER_API_KEY", ""),
              },

              {
                  "id": "orcarouter",
                  "name": "OrcaRouter",
                  "url": "https://api.orcarouter.ai/v1/chat/completions",
                  "model": "z-ai/glm-5.3-flash-free",
                  "key": os.environ.get("ORCAROUTER_API_KEY", ""),
              },

              {
                  "id": "nvidia",
                  "name": "NVIDIA NIM",
                  "url": "https://integrate.api.nvidia.com/v1/chat/completions",
                  "model": "z-ai/glm-5.3-flash",
                  "key": os.environ.get("NVIDIA_API_KEY", ""),
              },
          ]


          RUN_ID = os.environ.get("RUN_ID", "")
          RUN_ATTEMPT = os.environ.get("RUN_ATTEMPT", "")
          SCHEDULE = os.environ.get("SCHEDULE_EXPRESSION", "manual")


          # ============================================================
          # HELPERS
          # ============================================================

          def now():
              return datetime.now(timezone.utc)


          def iso(dt=None):
              dt = dt or now()
              return dt.isoformat().replace("+00:00", "Z")


          def safe_int(value):
              try:
                  return int(value)
              except Exception:
                  return None


          def safe_float(value):
              try:
                  return float(value)
              except Exception:
                  return None


          def read_file(path):
              try:
                  return Path(path).read_text(errors="replace")
              except Exception:
                  return ""


          def parse_headers(raw):
              result = {}

              for line in raw.splitlines():
                  if ":" not in line:
                      continue

                  key, value = line.split(":", 1)
                  result[key.strip().lower()] = value.strip()

              return result


          def classify(http, code, message):
              text = f"{code or ''} {message or ''}".lower()

              if http == 200:
                  return "up"

              if http == 429:

                  # UnoRouter sometimes returns this despite the route
                  # itself still being available.
                  if "empty_response" in text:
                      return "degraded"

                  return "rate_limited"

              if http in (500, 502, 503, 504):
                  return "down"

              if http in (401, 403):
                  return "auth_error"

              if http is None:
                  return "timeout"

              return "degraded"


          # ============================================================
          # PROBE ONE PROVIDER
          # ============================================================

          def probe(provider, cycle, cycle_started):
              timestamp = now()

              record = {
                  "ts": iso(timestamp),

                  # UTC minute is our logical deduplication key.
                  "minute": timestamp.strftime("%Y-%m-%dT%H:%MZ"),

                  "provider": provider["id"],
                  "name": provider["name"],

                  "requested_model": provider["model"],

                  "run_id": RUN_ID,
                  "run_attempt": RUN_ATTEMPT,
                  "schedule": SCHEDULE,

                  "cycle": cycle,
              }


              if not provider["key"]:
                  record.update({
                      "status": "missing_secret",
                      "http": None,
                  })

                  return record


              payload = {
                  "model": provider["model"],

                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply only OK."
                      }
                  ],

                  "max_tokens": 40,
                  "stream": False,
              }


              # NVIDIA GLM thinking is always enabled.
              # Explicit low effort makes this a cheaper/faster heartbeat.
              if provider["id"] == "nvidia":
                  payload["reasoning_effort"] = "low"


              h = tempfile.NamedTemporaryFile(delete=False)
              b = tempfile.NamedTemporaryFile(delete=False)

              header_path = h.name
              body_path = b.name

              h.close()
              b.close()


              cmd = [
                  "curl",
                  "-sS",

                  "--connect-timeout",
                  str(CONNECT_TIMEOUT),

                  "--max-time",
                  str(REQUEST_TIMEOUT),

                  "-D",
                  header_path,

                  "-o",
                  body_path,

                  "-w",
                  (
                      "%{http_code}\t"
                      "%{time_namelookup}\t"
                      "%{time_connect}\t"
                      "%{time_appconnect}\t"
                      "%{time_starttransfer}\t"
                      "%{time_total}"
                  ),

                  provider["url"],

                  "-H",
                  f"Authorization: Bearer {provider['key']}",

                  "-H",
                  "Content-Type: application/json",

                  "-d",
                  json.dumps(payload),
              ]


              wall_start = time.monotonic()


              try:
                  proc = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=REQUEST_TIMEOUT + 5,
                  )

              except subprocess.TimeoutExpired:
                  record.update({
                      "status": "timeout",
                      "http": None,
                      "latency_ms": REQUEST_TIMEOUT * 1000,
                      "error_code": "subprocess_timeout",
                  })

                  return record


              wall_ms = round(
                  (time.monotonic() - wall_start) * 1000
              )


              raw_headers = read_file(header_path)
              raw_body = read_file(body_path)


              try:
                  os.unlink(header_path)
              except Exception:
                  pass

              try:
                  os.unlink(body_path)
              except Exception:
                  pass


              # --------------------------------------------------------
              # CURL timing
              # --------------------------------------------------------

              fields = proc.stdout.strip().split("\t")

              http = None

              dns = None
              connect = None
              tls = None
              ttfb = None
              total = None


              if len(fields) >= 6:
                  http = safe_int(fields[0])

                  dns = safe_float(fields[1])
                  connect = safe_float(fields[2])
                  tls = safe_float(fields[3])
                  ttfb = safe_float(fields[4])
                  total = safe_float(fields[5])


              if http == 0:
                  http = None


              # --------------------------------------------------------
              # RESPONSE JSON
              # --------------------------------------------------------

              try:
                  body = json.loads(raw_body)
              except Exception:
                  body = {}


              actual_model = None
              error_code = None
              error_message = None


              if isinstance(body, dict):
                  actual_model = body.get("model")

                  error = body.get("error")

                  if isinstance(error, dict):
                      error_code = error.get("code")
                      error_message = error.get("message")


              headers = parse_headers(raw_headers)


              record.update({
                  "actual_model": actual_model,

                  "http": http,

                  "status": classify(
                      http,
                      error_code,
                      error_message,
                  ),

                  "latency_ms": (
                      round(total * 1000)
                      if total is not None
                      else wall_ms
                  ),

                  "dns_ms": (
                      round(dns * 1000)
                      if dns is not None
                      else None
                  ),

                  "connect_ms": (
                      round(connect * 1000)
                      if connect is not None
                      else None
                  ),

                  "tls_ms": (
                      round(tls * 1000)
                      if tls is not None
                      else None
                  ),

                  "ttfb_ms": (
                      round(ttfb * 1000)
                      if ttfb is not None
                      else None
                  ),

                  "retry_after": safe_int(
                      headers.get("retry-after")
                  ),

                  "rate_limit_limit": safe_int(
                      headers.get("x-ratelimit-limit")
                  ),

                  "rate_limit_remaining": safe_int(
                      headers.get("x-ratelimit-remaining")
                  ),

                  "rate_limit_reset": safe_int(
                      headers.get("x-ratelimit-reset")
                  ),

                  "error_code": error_code,

                  "curl_exit": proc.returncode,
              })


              if error_message:
                  record["error_message"] = error_message[:500]


              return record


          # ============================================================
          # APPEND SAFELY
          # ============================================================

          def append(record):
              with OUTPUT.open(
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      json.dumps(
                          record,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      )
                      + "\n"
                  )


          # ============================================================
          # MAIN SAMPLING LOOP
          # ============================================================

          print()
          print("=" * 90)
          print("InferencePulse redundant probe runner")
          print("=" * 90)

          print(f"run_id   = {RUN_ID}")
          print(f"schedule = {SCHEDULE}")
          print(f"cycles   = {CYCLES}")
          print()


          for cycle in range(CYCLES):

              cycle_start = time.monotonic()

              print()
              print("-" * 90)
              print(
                  f"cycle {cycle + 1}/{CYCLES} "
                  f"{iso()}"
              )
              print("-" * 90)


              # All four providers simultaneously.
              with ThreadPoolExecutor(
                  max_workers=len(PROVIDERS)
              ) as pool:

                  futures = {
                      pool.submit(
                          probe,
                          provider,
                          cycle,
                          cycle_start,
                      ): provider

                      for provider in PROVIDERS
                  }


                  for future in as_completed(futures):
                      provider = futures[future]

                      try:
                          record = future.result()

                      except Exception as exc:
                          timestamp = now()

                          record = {
                              "ts": iso(timestamp),
                              "minute": timestamp.strftime(
                                  "%Y-%m-%dT%H:%MZ"
                              ),

                              "provider": provider["id"],
                              "name": provider["name"],

                              "requested_model":
                                  provider["model"],

                              "status": "error",
                              "http": None,

                              "error_code":
                                  type(exc).__name__,

                              "error_message":
                                  str(exc)[:500],

                              "run_id": RUN_ID,
                              "schedule": SCHEDULE,
                              "cycle": cycle,
                          }


                      append(record)


                      print(
                          f"{record['name']:<12} "
                          f"{record['status']:<14} "
                          f"HTTP={str(record.get('http')):<4} "
                          f"latency={record.get('latency_ms')}ms "
                          f"ttfb={record.get('ttfb_ms')}ms"
                      )


              # Keep starts aligned ~60 seconds apart.
              if cycle < CYCLES - 1:

                  elapsed = (
                      time.monotonic()
                      - cycle_start
                  )

                  sleep_for = max(
                      0,
                      PERIOD_SECONDS - elapsed
                  )

                  print(
                      f"sleeping {sleep_for:.1f}s"
                  )

                  time.sleep(sleep_for)


          print()
          print("Probe shard complete:")
          print(OUTPUT)
          PY

          python /tmp/inferencepulse_probe.py

          echo
          echo "Shard lines:"
          wc -l pulse-output/shard.jsonl

      - name: Upload heartbeat shard
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: pulse-output/shard.jsonl
          retention-days: 2


  # ==========================================================
  # PUBLISH
  #
  # Probe runs overlap freely.
  #
  # Publisher jobs do NOT overlap.
  #
  # Each publisher:
  #   1. downloads this run's shard
  #   2. waits for publication lock
  #   3. checks out latest main
  #   4. stores shard under unique path
  #   5. recomputes deduplicated history/current/summary
  #   6. commits
  #   7. publishes GitHub Pages
  #
  # queue: max prevents pending publishers from being replaced.
  # ==========================================================

  publish:
    name: Merge and publish
    needs: probe

    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: inferencepulse-publisher
      queue: max

    steps:

      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download this run's shard
        uses: actions/download-artifact@v4
        with:
          name: pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming

      - name: Merge shard and rebuild site data
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Publisher may have waited in queue.
          # Refresh main before modifying anything.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/data/raw
          mkdir -p docs/data/history

          DATE_UTC="$(date -u +%Y/%m/%d)"

          mkdir -p "docs/data/raw/${DATE_UTC}"

          SHARD="docs/data/raw/${DATE_UTC}/${RUN_ID}-${RUN_ATTEMPT}.jsonl"

          cp incoming/shard.jsonl "$SHARD"

          cat > /tmp/inferencepulse_publish.py <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta


          ROOT = Path("docs")
          DATA = ROOT / "data"
          RAW = DATA / "raw"
          HISTORY = DATA / "history"

          CURRENT = DATA / "current.json"
          SUMMARY = DATA / "summary.json"
          MEASUREMENTS = DATA / "measurements.json"
          HOURLY = DATA / "hourly.json"


          def now():
              return datetime.now(timezone.utc)


          def iso(dt=None):
              return (
                  (dt or now())
                  .isoformat()
                  .replace("+00:00", "Z")
              )


          def parse_ts(value):
              return datetime.fromisoformat(
                  value.replace(
                      "Z",
                      "+00:00"
                  )
              )


          def load_raw(days=3650):
              cutoff = (
                  now()
                  - timedelta(days=days)
              )

              rows = []

              for path in RAW.rglob("*.jsonl"):

                  try:
                      lines = path.read_text(
                          errors="replace"
                      ).splitlines()
                  except Exception:
                      continue

                  for line in lines:
                      line = line.strip()

                      if not line:
                          continue

                      try:
                          row = json.loads(line)
                          ts = parse_ts(row["ts"])
                      except Exception:
                          continue

                      if ts >= cutoff:
                          rows.append(row)

              return rows


          # ============================================================
          # DEDUPE
          #
          # Multiple redundant runners can probe the same provider/minute.
          #
          # Prefer:
          #   up
          #   rate_limited
          #   degraded
          #   timeout/down/etc
          #
          # An "up" result proves usable inference during that minute,
          # even if another overlapping runner saw a transient failure.
          # ============================================================

          QUALITY = {
              "up": 100,
              "rate_limited": 80,
              "degraded": 60,
              "down": 40,
              "timeout": 30,
              "auth_error": 20,
              "missing_secret": 10,
              "error": 0,
          }


          def dedupe(rows):
              slots = {}

              for row in rows:

                  key = (
                      row.get("provider"),
                      row.get("minute"),
                  )

                  previous = slots.get(key)

                  if previous is None:
                      slots[key] = row
                      continue

                  old_quality = QUALITY.get(
                      previous.get("status"),
                      0,
                  )

                  new_quality = QUALITY.get(
                      row.get("status"),
                      0,
                  )

                  if new_quality > old_quality:
                      slots[key] = row

                  elif new_quality == old_quality:

                      # Prefer lower successful latency.
                      old_latency = previous.get(
                          "latency_ms"
                      )

                      new_latency = row.get(
                          "latency_ms"
                      )

                      if (
                          isinstance(
                              new_latency,
                              (int, float)
                          )
                          and (
                              not isinstance(
                                  old_latency,
                                  (int, float)
                              )
                              or new_latency < old_latency
                          )
                      ):
                          slots[key] = row


              return sorted(
                  slots.values(),
                  key=lambda r: (
                      r.get("ts", ""),
                      r.get("provider", ""),
                  ),
              )


          rows = dedupe(
              load_raw(days=3650)
          )


          # ============================================================
          # DAILY CANONICAL HISTORY
          # ============================================================

          grouped = {}

          for row in rows:

              dt = parse_ts(row["ts"])

              key = dt.strftime(
                  "%Y/%m/%d"
              )

              grouped.setdefault(
                  key,
                  []
              ).append(row)


          for day, day_rows in grouped.items():

              path = (
                  HISTORY
                  / f"{day}.jsonl"
              )

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              text = "".join(
                  json.dumps(
                      r,
                      separators=(",", ":"),
                      ensure_ascii=False,
                  )
                  + "\n"
                  for r in day_rows
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )


          # ============================================================
          # 24H DATA
          # ============================================================

          cutoff = (
              now()
              - timedelta(hours=24)
          )


          recent = [
              r
              for r in rows
              if parse_ts(r["ts"]) >= cutoff
          ]


          provider_ids = [
              "aihubmix",
              "unorouter",
              "orcarouter",
              "nvidia",
          ]

          # Sustainable planning ceilings. Daily quotas are normalized to QPH.
          # OrcaRouter is an InferencePulse test objective because its numeric
          # free-tier limit is not published. Predictions never exceed tested load.
          OBJECTIVES = {
              "aihubmix": {
                  "label": "5 RPM / 100 RPD",
                  "sustainable_qph": 100 / 24,
                  "source": "published",
              },
              "unorouter": {
                  "label": "~1 RPM",
                  "sustainable_qph": 60,
                  "source": "published",
              },
              "orcarouter": {
                  "label": "1 RPM test objective; numeric limit unknown",
                  "sustainable_qph": 60,
                  "source": "inferencepulse",
              },
              "nvidia": {
                  "label": "40 RPM; capacity capped by tested load",
                  "sustainable_qph": 2400,
                  "source": "published",
              },
          }

          SLO_SUCCESS_PCT = 99.0
          SLO_429_PCT = 1.0
          SLO_TIMEOUT_PCT = 1.0
          SLO_P95_MS = 5000

          # ============================================================
          # QUOTA-AWARE PAID-EQUIVALENT MODEL - AGENTIC CODING
          # ============================================================
          # The heartbeat remains tiny. Capacity/value is modeled as if useful
          # work were long agentic coding turns of 100K input + 20K output.
          # A provider is capped by BOTH observed reliable request capacity and
          # a published daily token quota when one is known. Unknown token quotas
          # are never silently treated as confirmed unlimited capacity.
          AGENTIC_INPUT_TOKENS = 100_000
          AGENTIC_OUTPUT_TOKENS = 20_000
          PRICE_INPUT_PER_M = 0.15
          PRICE_OUTPUT_PER_M = 0.50
          DAYS_PER_MONTH = 30

          TOKEN_QUOTAS = {
              "aihubmix": {
                  "daily_tokens": 1_000_000,
                  "status": "published",
                  "label": "1M tokens/day",
                  "source_url": "https://aihubmix.com/model/coding-glm-5.3-flash-free",
              },
              "unorouter": {
                  "daily_tokens": None,
                  "status": "unknown_shared_upstream",
                  "label": "No per-user daily token quota published; upstream pool is shared",
                  "source_url": "https://unorouter.com/en/blog/free-models-aggregated",
              },
              "orcarouter": {
                  "daily_tokens": None,
                  "status": "rate_limited_no_fixed_credit",
                  "label": "Free use described as rate-limited; numeric token cap not published",
                  "source_url": "https://www.orcarouter.ai/models/orcarouter/free",
              },
              "nvidia": {
                  "daily_tokens": None,
                  "status": "unknown",
                  "label": "No verified daily token quota in InferencePulse",
                  "source_url": None,
              },
          }

          AGENTIC_VALUE_PER_REQUEST = (
              AGENTIC_INPUT_TOKENS / 1_000_000 * PRICE_INPUT_PER_M
              + AGENTIC_OUTPUT_TOKENS / 1_000_000 * PRICE_OUTPUT_PER_M
          )

          def paid_equivalent(pid, qph):
              request_capacity_day = float(qph or 0) * 24
              total_tokens = AGENTIC_INPUT_TOKENS + AGENTIC_OUTPUT_TOKENS
              quota = TOKEN_QUOTAS[pid]
              daily_token_quota = quota.get("daily_tokens")
              token_limited_turns = (
                  daily_token_quota / total_tokens
                  if daily_token_quota is not None
                  else None
              )
              if token_limited_turns is None:
                  modeled_turns_day = request_capacity_day
                  quota_verified = False
                  limiting_factor = "request_capacity; token quota unknown"
              else:
                  modeled_turns_day = min(request_capacity_day, token_limited_turns)
                  quota_verified = True
                  limiting_factor = (
                      "token_quota"
                      if token_limited_turns < request_capacity_day
                      else "request_capacity"
                  )
              usd_day = modeled_turns_day * AGENTIC_VALUE_PER_REQUEST
              return {
                  "assumed_input_tokens_per_request": AGENTIC_INPUT_TOKENS,
                  "assumed_output_tokens_per_request": AGENTIC_OUTPUT_TOKENS,
                  "assumed_total_tokens_per_request": total_tokens,
                  "reference_input_usd_per_m": PRICE_INPUT_PER_M,
                  "reference_output_usd_per_m": PRICE_OUTPUT_PER_M,
                  "value_per_request_usd": round(AGENTIC_VALUE_PER_REQUEST, 6),
                  "request_capacity_turns_per_day": round(request_capacity_day, 2),
                  "published_daily_token_quota": daily_token_quota,
                  "token_quota_status": quota["status"],
                  "token_quota_label": quota["label"],
                  "token_quota_source_url": quota.get("source_url"),
                  "token_limited_turns_per_day": (
                      round(token_limited_turns, 2)
                      if token_limited_turns is not None else None
                  ),
                  "quota_verified": quota_verified,
                  "limiting_factor": limiting_factor,
                  "modeled_agentic_turns_per_day": round(modeled_turns_day, 2),
                  "modeled_tokens_per_day": round(modeled_turns_day * total_tokens),
                  "usd_per_day": round(usd_day, 2),
                  "usd_per_30d": round(usd_day * DAYS_PER_MONTH, 2),
              }

          def pct(n, d):
              return round(n / d * 100, 2) if d else None

          def incident_stats(entries, wanted):
              bad = [r for r in entries if r.get("status") == wanted]
              incidents = []
              current = None
              for row in bad:
                  ts = parse_ts(row["ts"])
                  if current is None or (ts - current["last"]).total_seconds() > 120:
                      if current:
                          incidents.append(current)
                      current = {"start": ts, "last": ts, "checks": 1}
                  else:
                      current["last"] = ts
                      current["checks"] += 1
              if current:
                  incidents.append(current)

              out = []
              durations = []
              for x in incidents:
                  seconds = max(
                      60,
                      int((x["last"] - x["start"]).total_seconds()) + 60
                  )
                  durations.append(seconds)
                  out.append({
                      "start": iso(x["start"]),
                      "end": iso(x["last"]),
                      "duration_seconds": seconds,
                      "checks": x["checks"],
                  })

              return {
                  "count": len(out),
                  "median_duration_seconds": percentile(durations, .50),
                  "p95_duration_seconds": percentile(durations, .95),
                  "longest_duration_seconds": max(durations) if durations else None,
                  "incidents": out[-100:],
              }

          def tested_qph(entries):
              hours = {}
              for row in entries:
                  dt = parse_ts(row["ts"]).replace(
                      minute=0, second=0, microsecond=0
                  )
                  hours.setdefault(dt, set()).add(row.get("minute"))
              values = [len(v) for v in hours.values()]
              return float(percentile(values, .95) or 0)

          def hourly_history(entries, ceiling):
              hours = {}
              for row in entries:
                  dt = parse_ts(row["ts"]).replace(
                      minute=0, second=0, microsecond=0
                  )
                  hours.setdefault(dt, []).append(row)

              result = []
              for hour in sorted(hours):
                  e = hours[hour]
                  count = len(e)
                  success = sum(r.get("status") == "up" for r in e)
                  limited = sum(
                      r.get("status") == "rate_limited" for r in e
                  )
                  timeouts = sum(
                      r.get("status") == "timeout" for r in e
                  )
                  success_rate = success / count if count else 0
                  eligible = min(float(ceiling), float(count))
                  result.append({
                      "hour": iso(hour),
                      "attempts": count,
                      "successes": success,
                      "rate_limited": limited,
                      "timeouts": timeouts,
                      "predicted_reliable_qph":
                          round(eligible * success_rate, 2),
                      "success_pct": round(success_rate * 100, 2),
                      "meets_slo":
                          success_rate * 100 >= SLO_SUCCESS_PCT,
                  })
              return result


          # ============================================================
          # CURRENT
          # ============================================================

          latest = {}


          for pid in provider_ids:

              matches = [
                  r
                  for r in recent
                  if r.get("provider") == pid
              ]

              if matches:
                  latest[pid] = matches[-1]


          CURRENT.write_text(
              json.dumps(
                  {
                      "project": "InferencePulse",
                      "generated_at": iso(),
                      "providers": latest,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          def percentile(values, fraction):

              if not values:
                  return None

              values = sorted(values)

              i = round(
                  (len(values) - 1)
                  * fraction
              )

              return values[i]


          summary = {}


          for pid in provider_ids:

              entries = [
                  r
                  for r in recent
                  if r.get("provider") == pid
              ]


              up = [
                  r
                  for r in entries
                  if r.get("status") == "up"
              ]


              latency = [
                  r["latency_ms"]
                  for r in up
                  if isinstance(
                      r.get("latency_ms"),
                      (int, float)
                  )
              ]


              observed_minutes = {
                  r.get("minute")
                  for r in entries
                  if r.get("minute")
              }


              name = (
                  entries[-1].get("name")
                  if entries
                  else pid
              )


              model = (
                  entries[-1].get(
                      "requested_model"
                  )
                  if entries
                  else None
              )


              count = len(entries)

              all_entries = [
                  r
                  for r in rows
                  if r.get("provider") == pid
              ]
              all_count = len(all_entries)
              all_up = [
                  r for r in all_entries
                  if r.get("status") == "up"
              ]
              all_429 = [
                  r for r in all_entries
                  if r.get("status") == "rate_limited"
              ]
              all_timeout = [
                  r for r in all_entries
                  if r.get("status") == "timeout"
              ]
              all_latency = [
                  r.get("latency_ms")
                  for r in all_up
                  if isinstance(r.get("latency_ms"), (int, float))
              ]

              objective = OBJECTIVES[pid]
              observed_qph = tested_qph(all_entries)
              success_probability = (
                  len(all_up) / all_count
                  if all_count
                  else 0
              )
              eligible_qph = min(
                  float(objective["sustainable_qph"]),
                  observed_qph,
              )
              predicted_qph = (
                  eligible_qph * success_probability
              )

              success_all_pct = pct(len(all_up), all_count)
              limited_all_pct = pct(len(all_429), all_count)
              timeout_all_pct = pct(len(all_timeout), all_count)
              all_p95 = percentile(all_latency, .95)

              slo = {
                  "success": {
                      "target": ">= 99%",
                      "actual": success_all_pct,
                      "pass": bool(
                          all_count
                          and success_all_pct >= SLO_SUCCESS_PCT
                      ),
                  },
                  "rate_limit": {
                      "target": "<= 1%",
                      "actual": limited_all_pct,
                      "pass": bool(
                          all_count
                          and limited_all_pct <= SLO_429_PCT
                      ),
                  },
                  "timeout": {
                      "target": "<= 1%",
                      "actual": timeout_all_pct,
                      "pass": bool(
                          all_count
                          and timeout_all_pct <= SLO_TIMEOUT_PCT
                      ),
                  },
                  "p95_latency": {
                      "target": "< 5000 ms",
                      "actual": all_p95,
                      "pass": bool(
                          all_p95 is not None
                          and all_p95 < SLO_P95_MS
                      ),
                  },
              }

              summary[pid] = {
                  "name": name,
                  "model": model,

                  "checks": count,

                  "successful_checks":
                      len(up),

                  "success_pct": (
                      round(
                          len(up)
                          / count
                          * 100,
                          2,
                      )
                      if count
                      else None
                  ),

                  "rate_limited_checks":
                      sum(
                          1
                          for r in entries
                          if r.get("status")
                          == "rate_limited"
                      ),

                  "degraded_checks":
                      sum(
                          1
                          for r in entries
                          if r.get("status")
                          == "degraded"
                      ),

                  "timeout_checks":
                      sum(
                          1
                          for r in entries
                          if r.get("status")
                          == "timeout"
                      ),

                  "median_latency_ms":
                      percentile(
                          latency,
                          0.50
                      ),

                  "p95_latency_ms":
                      percentile(
                          latency,
                          0.95
                      ),

                  "observed_minutes":
                      len(observed_minutes),

                  "coverage_pct": round(
                      min(
                          100,
                          len(observed_minutes)
                          / 1440
                          * 100
                      ),
                      2
                  ),

                  "objective": objective,
                  "tested_qph": round(observed_qph, 2),
                  "predicted_reliable_qph":
                      round(predicted_qph, 2),
                  "paid_equivalent_agentic":
                      paid_equivalent(pid, predicted_qph),
                  "all_time_checks": all_count,
                  "all_time_success_pct": success_all_pct,
                  "all_time_429_pct": limited_all_pct,
                  "all_time_timeout_pct": timeout_all_pct,
                  "all_time_p95_latency_ms": all_p95,
                  "slo": slo,
                  "meets_slo": all(
                      item["pass"]
                      for item in slo.values()
                  ),
                  "rate_limit_incidents":
                      incident_stats(
                          all_entries,
                          "rate_limited"
                      ),
                  "timeout_incidents":
                      incident_stats(
                          all_entries,
                          "timeout"
                      ),

                  "current_status": (
                      entries[-1].get("status")
                      if entries
                      else "unknown"
                  ),

                  "last_check": (
                      entries[-1].get("ts")
                      if entries
                      else None
                  ),
              }


          SUMMARY.write_text(
              json.dumps(
                  {
                      "project": "InferencePulse",
                      "window": "24h",
                      "generated_at": iso(),
                      "providers": summary,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # CAPACITY + HISTORICAL EVIDENCE
          # ============================================================

          all_measurements = {}
          all_hourly = {}

          for pid in provider_ids:
              provider_rows = [
                  r for r in rows
                  if r.get("provider") == pid
              ]
              all_measurements[pid] = [
                  {
                      "ts": r.get("ts"),
                      "status": r.get("status"),
                      "http": r.get("http"),
                      "latency_ms": r.get("latency_ms"),
                      "retry_after": r.get("retry_after"),
                      "rate_limit_remaining":
                          r.get("rate_limit_remaining"),
                      "error_code": r.get("error_code"),
                      "run_id": r.get("run_id"),
                  }
                  for r in provider_rows
              ]
              all_hourly[pid] = hourly_history(
                  provider_rows,
                  OBJECTIVES[pid]["sustainable_qph"],
              )

          headline_qph = round(
              sum(
                  s.get("predicted_reliable_qph", 0)
                  for s in summary.values()
              ),
              2,
          )

          # Two economic totals are intentional:
          # - modeled: includes providers whose token quota is unknown, clearly flagged
          # - quota_verified: only providers with a numeric published token quota
          modeled_usd_day = round(sum(
              s["paid_equivalent_agentic"]["usd_per_day"]
              for s in summary.values()
          ), 2)
          modeled_usd_30d = round(modeled_usd_day * DAYS_PER_MONTH, 2)
          verified_usd_day = round(sum(
              s["paid_equivalent_agentic"]["usd_per_day"]
              for s in summary.values()
              if s["paid_equivalent_agentic"]["quota_verified"]
          ), 2)
          verified_usd_30d = round(verified_usd_day * DAYS_PER_MONTH, 2)
          modeled_turns_day = round(sum(
              s["paid_equivalent_agentic"]["modeled_agentic_turns_per_day"]
              for s in summary.values()
          ), 2)

          SUMMARY.write_text(
              json.dumps(
                  {
                      "project": "InferencePulse",
                      "window": "24h + all-time SLO evidence",
                      "generated_at": iso(),
                      "headline": {
                          "predicted_reliable_qph": headline_qph,
                          "paid_equivalent_agentic": {
                              "modeled_agentic_turns_per_day": modeled_turns_day,
                              "usd_per_day": modeled_usd_day,
                              "usd_per_30d": modeled_usd_30d,
                              "quota_verified_usd_per_day": verified_usd_day,
                              "quota_verified_usd_per_30d": verified_usd_30d,
                          },
                          "providers_meeting_slo": sum(
                              bool(s.get("meets_slo"))
                              for s in summary.values()
                          ),
                          "provider_count": len(provider_ids),
                          "historical_measurements": len(rows),
                      },
                      "slo_policy": {
                          "success_pct": SLO_SUCCESS_PCT,
                          "rate_limited_pct": SLO_429_PCT,
                          "timeout_pct": SLO_TIMEOUT_PCT,
                          "p95_latency_ms": SLO_P95_MS,
                          "note":
                              "InferencePulse objectives; objective source "
                              "is shown per provider.",
                      },
                      "paid_equivalent_policy": {
                          "workload": "agentic coding",
                          "input_tokens_per_request": AGENTIC_INPUT_TOKENS,
                          "output_tokens_per_request": AGENTIC_OUTPUT_TOKENS,
                          "input_usd_per_m": PRICE_INPUT_PER_M,
                          "output_usd_per_m": PRICE_OUTPUT_PER_M,
                          "days_per_month": DAYS_PER_MONTH,
                          "note": (
                              "Heavy-agent model: 100K input + 20K output per turn. "
                              "Known numeric token quotas cap modeled turns. Providers "
                              "with unknown token quotas remain estimates and are not "
                              "included in the quota-verified dollar subtotal."
                          ),
                          "token_quotas": TOKEN_QUOTAS,
                      },
                      "providers": summary,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          MEASUREMENTS.write_text(
              json.dumps(
                  {
                      "generated_at": iso(),
                      "providers": all_measurements,
                  },
                  separators=(",", ":"),
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          HOURLY.write_text(
              json.dumps(
                  {
                      "generated_at": iso(),
                      "providers": all_hourly,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # SIMPLE WEBSITE
          # ============================================================

          html = r'''<!doctype html>
          <html lang="en"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>InferencePulse</title>
          <style>
          :root{color-scheme:dark;--bg:#080a0f;--card:#111620;--card2:#0d1119;--border:#252d3b;--text:#f5f7fb;--muted:#8d99aa;--green:#3dde9d;--yellow:#f1c75b;--red:#ff6678;--blue:#72a7ff}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
          main{width:min(1240px,calc(100% - 28px));margin:auto;padding:48px 0 80px}h1{font-size:clamp(38px,6vw,64px);letter-spacing:-.05em;margin:0}.subtitle{color:var(--muted);font-size:16px;margin:8px 0 28px}
          .hero,.provider{border:1px solid var(--border);background:var(--card);border-radius:16px}.hero{padding:28px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-size:11px;font-weight:800}.hero-num{font-size:clamp(64px,12vw,112px);line-height:.95;font-weight:900;letter-spacing:-.06em;margin:10px 0}.hero-sub{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted)}.value{font-size:32px;font-weight:900;margin-top:8px}.money{color:var(--green)}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}.mini{padding:16px;border:1px solid var(--border);border-radius:12px;background:var(--card2)}.mini strong{display:block;font-size:28px;margin-top:5px}
          .provider{margin:18px 0;overflow:hidden}.head{padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px}.head h2{margin:0;font-size:24px}.qph{font-size:40px;font-weight:900}.meta{color:var(--muted);margin-top:5px}.pass,.up{color:var(--green)}.fail,.timeout,.down,.auth_error{color:var(--red)}.rate_limited,.degraded{color:var(--yellow)}
          .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.metric{background:var(--card2);padding:14px}.metric b{display:block;font-size:19px;margin-top:4px}
          .slos,.timeline{padding:18px 22px}.slo{display:grid;grid-template-columns:1.4fr 1fr 1fr 70px;gap:12px;padding:9px 0;border-bottom:1px solid #202735}.bars{display:flex;height:30px;gap:1px;margin-top:10px}.bar{flex:1;min-width:1px}.bar.up{background:var(--green)}.bar.rate_limited{background:var(--yellow)}.bar.timeout,.bar.down,.bar.auth_error,.bar.error{background:var(--red)}.bar.degraded{background:#df9b45}
          details{border-top:1px solid var(--border)}summary{cursor:pointer;padding:16px 22px;font-weight:800}.body{padding:0 22px 20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:9px;border-bottom:1px solid #202735;font-variant-numeric:tabular-nums}th{color:var(--muted);font-size:11px;text-transform:uppercase}.note,footer{color:var(--muted);font-size:12px}footer{margin-top:28px}
          @media(max-width:650px){.head{grid-template-columns:1fr}.slo{grid-template-columns:1fr 1fr}}
          </style></head><body><main>
          <h1>InferencePulse</h1>
          <div class="subtitle">Reliable free GLM-5.3-Flash capacity, audited against rate-limit and availability objectives.</div>
          <section class="hero"><div class="eyebrow">Predicted reliable requests / hour</div><div class="hero-num" id="headline">—</div><div class="eyebrow">Modeled paid equivalent · agentic coding</div><div class="value money" id="paidValue">—</div><div class="hero-sub" id="heroSub"></div><p class="note" id="valueNote"></p></section>
          <div class="grid" id="capacity"></div><div id="providers"></div><footer id="footer"></footer>
          </main><script>
          const e=x=>String(x??"—").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
          const n=x=>x==null?"—":Number(x).toLocaleString(undefined,{maximumFractionDigits:2});
          const usd=x=>x==null?"—":Number(x).toLocaleString(undefined,{style:"currency",currency:"USD",maximumFractionDigits:2});
          const dur=s=>s==null?"—":s<120?s+"s":s<7200?Math.round(s/60)+"m":(s/3600).toFixed(1)+"h";
          function timeline(rows){const a=rows.slice(-240);return a.length?'<div class="bars">'+a.map(r=>`<i class="bar ${e(r.status)}" title="${e(r.ts)} · ${e(r.status)} · HTTP ${e(r.http)}"></i>`).join("")+'</div>':'<p class="note">No history yet.</p>'}
          function incidents(x,label){const a=x.incidents||[];return `<p><b>${label}</b> · ${n(x.count)} incidents · median ${dur(x.median_duration_seconds)} · P95 ${dur(x.p95_duration_seconds)} · longest ${dur(x.longest_duration_seconds)}</p>`+(a.length?`<table><thead><tr><th>Start</th><th>End</th><th>Duration</th><th>Checks</th></tr></thead><tbody>${a.slice().reverse().map(i=>`<tr><td>${e(i.start)}</td><td>${e(i.end)}</td><td>${dur(i.duration_seconds)}</td><td>${n(i.checks)}</td></tr>`).join("")}</tbody></table>`:"")}
          function card(id,s,m,h){const labels={success:"Successful requests",rate_limit:"Rate limited",timeout:"Timeouts",p95_latency:"P95 latency"};const slos=Object.entries(s.slo).map(([k,v])=>`<div class="slo"><span>${labels[k]}</span><span>Target ${e(v.target)}</span><span>Observed ${n(v.actual)}${k==="p95_latency"?" ms":"%"}</span><b class="${v.pass?"pass":"fail"}">${v.pass?"PASS":"FAIL"}</b></div>`).join("");return `<section class="provider"><div class="head"><div><h2>${e(s.name)} <span class="${s.meets_slo?"pass":"fail"}">${s.meets_slo?"SLO PASS":"SLO FAIL"}</span></h2><div class="meta">${e(s.model)} · ${e(s.objective.label)} · ${e(s.objective.source)} objective</div></div><div><div class="eyebrow">Predicted reliable QPH</div><div class="qph">${n(s.predicted_reliable_qph)}</div><div class="${e(s.current_status)}">${e(s.current_status)} now</div></div></div><div class="metrics"><div class="metric"><span class="eyebrow">Heavy turns / day</span><b>${n(s.paid_equivalent_agentic?.modeled_agentic_turns_per_day)}</b></div><div class="metric"><span class="eyebrow">Agentic value / 30d</span><b class="money">${usd(s.paid_equivalent_agentic?.usd_per_30d)}</b></div><div class="metric"><span class="eyebrow">Modeled tokens / day</span><b>${n(s.paid_equivalent_agentic?.modeled_tokens_per_day)}</b></div><div class="metric"><span class="eyebrow">Capacity limiter</span><b>${e(s.paid_equivalent_agentic?.limiting_factor)}</b></div><div class="metric"><span class="eyebrow">Tested load</span><b>${n(s.tested_qph)}/h</b></div><div class="metric"><span class="eyebrow">All-time success</span><b>${n(s.all_time_success_pct)}%</b></div><div class="metric"><span class="eyebrow">429</span><b>${n(s.all_time_429_pct)}%</b></div><div class="metric"><span class="eyebrow">Timeout</span><b>${n(s.all_time_timeout_pct)}%</b></div><div class="metric"><span class="eyebrow">P95 latency</span><b>${n(s.all_time_p95_latency_ms)} ms</b></div><div class="metric"><span class="eyebrow">Evidence</span><b>${n(s.all_time_checks)}</b></div></div><div class="slos"><div class="eyebrow">Service-level objectives · all retained history</div>${slos}</div><div class="timeline"><div class="eyebrow">Recent observations</div>${timeline(m)}</div><details><summary>Rate-limit incident history (${n(s.rate_limit_incidents.count)})</summary><div class="body">${incidents(s.rate_limit_incidents,"HTTP 429")}</div></details><details><summary>Timeout incident history (${n(s.timeout_incidents.count)})</summary><div class="body">${incidents(s.timeout_incidents,"Timeout")}</div></details><details><summary>Hourly capacity history</summary><div class="body"><table><thead><tr><th>Hour</th><th>Attempts</th><th>Success</th><th>429</th><th>Timeout</th><th>Predicted reliable QPH</th><th>SLO</th></tr></thead><tbody>${h.slice().reverse().map(x=>`<tr><td>${e(x.hour)}</td><td>${n(x.attempts)}</td><td>${n(x.successes)}</td><td>${n(x.rate_limited)}</td><td>${n(x.timeouts)}</td><td>${n(x.predicted_reliable_qph)}</td><td class="${x.meets_slo?"pass":"fail"}">${x.meets_slo?"PASS":"FAIL"}</td></tr>`).join("")}</tbody></table></div></details><details><summary>Every historical measurement (${m.length})</summary><div class="body"><table><thead><tr><th>Time</th><th>Status</th><th>HTTP</th><th>Latency</th><th>Retry-after</th><th>Remaining</th><th>Run</th></tr></thead><tbody>${m.slice().reverse().map(r=>`<tr><td>${e(r.ts)}</td><td class="${e(r.status)}">${e(r.status)}</td><td>${e(r.http)}</td><td>${n(r.latency_ms)} ms</td><td>${e(r.retry_after)}</td><td>${e(r.rate_limit_remaining)}</td><td>${e(r.run_id)}</td></tr>`).join("")}</tbody></table></div></details></section>`}
          async function load(){const t=Date.now();const [s,m,h]=await Promise.all([fetch(`data/summary.json?${t}`).then(r=>r.json()),fetch(`data/measurements.json?${t}`).then(r=>r.json()),fetch(`data/hourly.json?${t}`).then(r=>r.json())]);document.querySelector("#headline").textContent=n(s.headline.predicted_reliable_qph);const pe=s.headline.paid_equivalent_agentic||{};const pp=s.paid_equivalent_policy||{};document.querySelector("#paidValue").textContent=`${usd(pe.usd_per_day)} / day · ${usd(pe.usd_per_30d)} / 30d`;document.querySelector("#valueNote").textContent=`Heavy agent: ${n(pp.input_tokens_per_request)} input + ${n(pp.output_tokens_per_request)} output tokens/turn. Quota-verified subtotal: ${usd(pe.quota_verified_usd_per_30d)} / 30d. Unknown provider token quotas remain modeled estimates.`;document.querySelector("#heroSub").innerHTML=`<span><b>${s.headline.providers_meeting_slo}/${s.headline.provider_count}</b> providers meet SLO</span><span><b>${n(s.headline.historical_measurements)}</b> historical measurements</span>`;document.querySelector("#capacity").innerHTML=Object.entries(s.providers).map(([id,p])=>`<div class="mini"><span class="eyebrow">${e(p.name)}</span><strong>${n(p.predicted_reliable_qph)} req/h</strong><span class="${p.meets_slo?"pass":"fail"}">${p.meets_slo?"MEETS SLO":"FAILS SLO"}</span></div>`).join("");document.querySelector("#providers").innerHTML=Object.entries(s.providers).map(([id,p])=>card(id,p,m.providers[id]||[],h.providers[id]||[])).join("");document.querySelector("#footer").textContent="Updated "+new Date(s.generated_at).toLocaleString()+" · SLO thresholds are InferencePulse objectives unless the provider objective is marked published."}
          load();setInterval(load,60000);
          </script></body></html>
