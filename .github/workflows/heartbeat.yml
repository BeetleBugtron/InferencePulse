      - name: Commit merged heartbeat data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "InferencePulse Bot"
          git config user.email "inferencepulse@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit \
            -m "pulse: run ${{ github.run_id }}"

          # Publisher is serialized, but refresh once more just in case
          # some unrelated human commit landed.
          for attempt in 1 2 3; do

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; rebasing and retrying..."

            git pull --rebase origin main

            sleep 2
          done

          echo "Could not push after retries."
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment
        run: |
          echo "InferencePulse:"
          echo "${{ steps.deployment.outputs.page_url }}"
