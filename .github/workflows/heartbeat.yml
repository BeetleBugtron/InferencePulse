name: InferencePulse

on:
  workflow_dispatch:

  schedule:
    # Three staggered trigger streams.
    # Each individual cron still respects GitHub's 5-minute minimum.
    #
    # A: 01,06,11,16...
    # B: 02,07,12,17...
    # C: 03,08,13,18...
    #
    # Avoids :00, which GitHub says is a high-load time.
    - cron: "1-56/5 * * * *"
    - cron: "2-57/5 * * * *"
    - cron: "3-58/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read


# ============================================================
# IMPORTANT:
#
# DO NOT put workflow-level concurrency here.
#
# We WANT probe jobs from separate scheduled runs to overlap.
#
# Only the publish job is serialized below.
# ============================================================


jobs:

  # ==========================================================
  # PROBE
  #
  # Each workflow run:
  #   - checks all four providers in parallel
  #   - once per minute
  #   - for 8 minutes
  #   - writes ONE unique shard
  #   - uploads shard as artifact
  #
  # Multiple probe jobs are intentionally allowed to overlap.
  # ==========================================================

  probe:
    name: Probe inference servers
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run redundant minute heartbeats
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          mkdir -p pulse-output

          cat > /tmp/inferencepulse_probe.py <<'PY'
          import os
          import json
          import time
          import tempfile
          import subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed


          # ============================================================
          # SETTINGS
          # ============================================================

          # Eight observations:
          #
          # minute 0
          # minute 1
          # ...
          # minute 7
          #
          # This intentionally overlaps subsequent scheduled runners.
          CYCLES = 8
          PERIOD_SECONDS = 60

          CONNECT_TIMEOUT = 10

          # We learned NVIDIA can hang indefinitely.
          # Don't let one bad NVIDIA probe block a minute forever.
          REQUEST_TIMEOUT = 25

          OUTPUT = Path("pulse-output/shard.jsonl")


          PROVIDERS = [
              {
                  "id": "aihubmix",
                  "name": "AIHubMix",
                  "url": "https://aihubmix.com/v1/chat/completions",
                  "model": "coding-glm-5.3-flash-free",
                  "key": os.environ.get("AIHUBMIX_API_KEY", ""),
              },

              {
                  "id": "unorouter",
                  "name": "UnoRouter",
                  "url": "https://api.unorouter.com/v1/chat/completions",
                  "model": "glm-5.3-flash:free",
                  "key": os.environ.get("UNOROUTER_API_KEY", ""),
              },

              {
                  "id": "orcarouter",
                  "name": "OrcaRouter",
                  "url": "https://api.orcarouter.ai/v1/chat/completions",
                  "model": "z-ai/glm-5.3-flash-free",
                  "key": os.environ.get("ORCAROUTER_API_KEY", ""),
              },

              {
                  "id": "nvidia",
                  "name": "NVIDIA NIM",
                  "url": "https://integrate.api.nvidia.com/v1/chat/completions",
                  "model": "z-ai/glm-5.3-flash",
                  "key": os.environ.get("NVIDIA_API_KEY", ""),
              },
          ]


          RUN_ID = os.environ.get("RUN_ID", "")
          RUN_ATTEMPT = os.environ.get("RUN_ATTEMPT", "")
          SCHEDULE = os.environ.get("SCHEDULE_EXPRESSION", "manual")


          # ============================================================
          # HELPERS
          # ============================================================

          def now():
              return datetime.now(timezone.utc)


          def iso(dt=None):
              dt = dt or now()
              return dt.isoformat().replace("+00:00", "Z")


          def safe_int(value):
              try:
                  return int(value)
              except Exception:
                  return None


          def safe_float(value):
              try:
                  return float(value)
              except Exception:
                  return None


          def read_file(path):
              try:
                  return Path(path).read_text(errors="replace")
              except Exception:
                  return ""


          def parse_headers(raw):
              result = {}

              for line in raw.splitlines():
                  if ":" not in line:
                      continue

                  key, value = line.split(":", 1)
                  result[key.strip().lower()] = value.strip()

              return result


          def classify(http, code, message):
              text = f"{code or ''} {message or ''}".lower()

              if http == 200:
                  return "up"

              if http == 429:

                  # UnoRouter sometimes returns this despite the route
                  # itself still being available.
                  if "empty_response" in text:
                      return "degraded"

                  return "rate_limited"

              if http in (500, 502, 503, 504):
                  return "down"

              if http in (401, 403):
                  return "auth_error"

              if http is None:
                  return "timeout"

              return "degraded"


          # ============================================================
          # PROBE ONE PROVIDER
          # ============================================================

          def probe(provider, cycle, cycle_started):
              timestamp = now()

              record = {
                  "ts": iso(timestamp),

                  # UTC minute is our logical deduplication key.
                  "minute": timestamp.strftime("%Y-%m-%dT%H:%MZ"),

                  "provider": provider["id"],
                  "name": provider["name"],

                  "requested_model": provider["model"],

                  "run_id": RUN_ID,
                  "run_attempt": RUN_ATTEMPT,
                  "schedule": SCHEDULE,

                  "cycle": cycle,
              }


              if not provider["key"]:
                  record.update({
                      "status": "missing_secret",
                      "http": None,
                  })

                  return record


              payload = {
                  "model": provider["model"],

                  "messages": [
                      {
                          "role": "user",
                          "content": "Reply only OK."
                      }
                  ],

                  "max_tokens": 40,
                  "stream": False,
              }


              # NVIDIA GLM thinking is always enabled.
              # Explicit low effort makes this a cheaper/faster heartbeat.
              if provider["id"] == "nvidia":
                  payload["reasoning_effort"] = "low"


              h = tempfile.NamedTemporaryFile(delete=False)
              b = tempfile.NamedTemporaryFile(delete=False)

              header_path = h.name
              body_path = b.name

              h.close()
              b.close()


              cmd = [
                  "curl",
                  "-sS",

                  "--connect-timeout",
                  str(CONNECT_TIMEOUT),

                  "--max-time",
                  str(REQUEST_TIMEOUT),

                  "-D",
                  header_path,

                  "-o",
                  body_path,

                  "-w",
                  (
                      "%{http_code}\t"
                      "%{time_namelookup}\t"
                      "%{time_connect}\t"
                      "%{time_appconnect}\t"
                      "%{time_starttransfer}\t"
                      "%{time_total}"
                  ),

                  provider["url"],

                  "-H",
                  f"Authorization: Bearer {provider['key']}",

                  "-H",
                  "Content-Type: application/json",

                  "-d",
                  json.dumps(payload),
              ]


              wall_start = time.monotonic()


              try:
                  proc = subprocess.run(
                      cmd,
                      capture_output=True,
                      text=True,
                      timeout=REQUEST_TIMEOUT + 5,
                  )

              except subprocess.TimeoutExpired:
                  record.update({
                      "status": "timeout",
                      "http": None,
                      "latency_ms": REQUEST_TIMEOUT * 1000,
                      "error_code": "subprocess_timeout",
                  })

                  return record


              wall_ms = round(
                  (time.monotonic() - wall_start) * 1000
              )


              raw_headers = read_file(header_path)
              raw_body = read_file(body_path)


              try:
                  os.unlink(header_path)
              except Exception:
                  pass

              try:
                  os.unlink(body_path)
              except Exception:
                  pass


              # --------------------------------------------------------
              # CURL timing
              # --------------------------------------------------------

              fields = proc.stdout.strip().split("\t")

              http = None

              dns = None
              connect = None
              tls = None
              ttfb = None
              total = None


              if len(fields) >= 6:
                  http = safe_int(fields[0])

                  dns = safe_float(fields[1])
                  connect = safe_float(fields[2])
                  tls = safe_float(fields[3])
                  ttfb = safe_float(fields[4])
                  total = safe_float(fields[5])


              if http == 0:
                  http = None


              # --------------------------------------------------------
              # RESPONSE JSON
              # --------------------------------------------------------

              try:
                  body = json.loads(raw_body)
              except Exception:
                  body = {}


              actual_model = None
              error_code = None
              error_message = None


              if isinstance(body, dict):
                  actual_model = body.get("model")

                  error = body.get("error")

                  if isinstance(error, dict):
                      error_code = error.get("code")
                      error_message = error.get("message")


              headers = parse_headers(raw_headers)


              record.update({
                  "actual_model": actual_model,

                  "http": http,

                  "status": classify(
                      http,
                      error_code,
                      error_message,
                  ),

                  "latency_ms": (
                      round(total * 1000)
                      if total is not None
                      else wall_ms
                  ),

                  "dns_ms": (
                      round(dns * 1000)
                      if dns is not None
                      else None
                  ),

                  "connect_ms": (
                      round(connect * 1000)
                      if connect is not None
                      else None
                  ),

                  "tls_ms": (
                      round(tls * 1000)
                      if tls is not None
                      else None
                  ),

                  "ttfb_ms": (
                      round(ttfb * 1000)
                      if ttfb is not None
                      else None
                  ),

                  "retry_after": safe_int(
                      headers.get("retry-after")
                  ),

                  "rate_limit_limit": safe_int(
                      headers.get("x-ratelimit-limit")
                  ),

                  "rate_limit_remaining": safe_int(
                      headers.get("x-ratelimit-remaining")
                  ),

                  "rate_limit_reset": safe_int(
                      headers.get("x-ratelimit-reset")
                  ),

                  "error_code": error_code,

                  "curl_exit": proc.returncode,
              })


              if error_message:
                  record["error_message"] = error_message[:500]


              return record


          # ============================================================
          # APPEND SAFELY
          # ============================================================

          def append(record):
              with OUTPUT.open(
                  "a",
                  encoding="utf-8"
              ) as f:
                  f.write(
                      json.dumps(
                          record,
                          separators=(",", ":"),
                          ensure_ascii=False,
                      )
                      + "\n"
                  )


          # ============================================================
          # MAIN SAMPLING LOOP
          # ============================================================

          print()
          print("=" * 90)
          print("InferencePulse redundant probe runner")
          print("=" * 90)

          print(f"run_id   = {RUN_ID}")
          print(f"schedule = {SCHEDULE}")
          print(f"cycles   = {CYCLES}")
          print()


          for cycle in range(CYCLES):

              cycle_start = time.monotonic()

              print()
              print("-" * 90)
              print(
                  f"cycle {cycle + 1}/{CYCLES} "
                  f"{iso()}"
              )
              print("-" * 90)


              # All four providers simultaneously.
              with ThreadPoolExecutor(
                  max_workers=len(PROVIDERS)
              ) as pool:

                  futures = {
                      pool.submit(
                          probe,
                          provider,
                          cycle,
                          cycle_start,
                      ): provider

                      for provider in PROVIDERS
                  }


                  for future in as_completed(futures):
                      provider = futures[future]

                      try:
                          record = future.result()

                      except Exception as exc:
                          timestamp = now()

                          record = {
                              "ts": iso(timestamp),
                              "minute": timestamp.strftime(
                                  "%Y-%m-%dT%H:%MZ"
                              ),

                              "provider": provider["id"],
                              "name": provider["name"],

                              "requested_model":
                                  provider["model"],

                              "status": "error",
                              "http": None,

                              "error_code":
                                  type(exc).__name__,

                              "error_message":
                                  str(exc)[:500],

                              "run_id": RUN_ID,
                              "schedule": SCHEDULE,
                              "cycle": cycle,
                          }


                      append(record)


                      print(
                          f"{record['name']:<12} "
                          f"{record['status']:<14} "
                          f"HTTP={str(record.get('http')):<4} "
                          f"latency={record.get('latency_ms')}ms "
                          f"ttfb={record.get('ttfb_ms')}ms"
                      )


              # Keep starts aligned ~60 seconds apart.
              if cycle < CYCLES - 1:

                  elapsed = (
                      time.monotonic()
                      - cycle_start
                  )

                  sleep_for = max(
                      0,
                      PERIOD_SECONDS - elapsed
                  )

                  print(
                      f"sleeping {sleep_for:.1f}s"
                  )

                  time.sleep(sleep_for)


          print()
          print("Probe shard complete:")
          print(OUTPUT)
          PY

          python /tmp/inferencepulse_probe.py

          echo
          echo "Shard lines:"
          wc -l pulse-output/shard.jsonl

      - name: Upload heartbeat shard
        uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: pulse-output/shard.jsonl
          retention-days: 2


  # ==========================================================
  # PUBLISH
  #
  # Probe runs overlap freely.
  #
  # Publisher jobs do NOT overlap.
  #
  # Each publisher:
  #   1. downloads this run's shard
  #   2. waits for publication lock
  #   3. checks out latest main
  #   4. stores shard under unique path
  #   5. recomputes deduplicated history/current/summary
  #   6. commits
  #   7. publishes GitHub Pages
  #
  # queue: max prevents pending publishers from being replaced.
  # ==========================================================

  publish:
    name: Merge and publish
    needs: probe

    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: inferencepulse-publisher
      queue: max

    steps:

      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download this run's shard
        uses: actions/download-artifact@v4
        with:
          name: pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming

      - name: Merge shard and rebuild site data
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # Publisher may have waited in queue.
          # Refresh main before modifying anything.
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/data/raw
          mkdir -p docs/data/history

          DATE_UTC="$(date -u +%Y/%m/%d)"

          mkdir -p "docs/data/raw/${DATE_UTC}"

          SHARD="docs/data/raw/${DATE_UTC}/${RUN_ID}-${RUN_ATTEMPT}.jsonl"

          cp incoming/shard.jsonl "$SHARD"

          cat > /tmp/inferencepulse_publish.py <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta


          ROOT = Path("docs")
          DATA = ROOT / "data"
          RAW = DATA / "raw"
          HISTORY = DATA / "history"

          CURRENT = DATA / "current.json"
          SUMMARY = DATA / "summary.json"


          def now():
              return datetime.now(timezone.utc)


          def iso(dt=None):
              return (
                  (dt or now())
                  .isoformat()
                  .replace("+00:00", "Z")
              )


          def parse_ts(value):
              return datetime.fromisoformat(
                  value.replace(
                      "Z",
                      "+00:00"
                  )
              )


          def load_raw(days=2):
              cutoff = (
                  now()
                  - timedelta(days=days)
              )

              rows = []

              for path in RAW.rglob("*.jsonl"):

                  try:
                      lines = path.read_text(
                          errors="replace"
                      ).splitlines()
                  except Exception:
                      continue

                  for line in lines:
                      line = line.strip()

                      if not line:
                          continue

                      try:
                          row = json.loads(line)
                          ts = parse_ts(row["ts"])
                      except Exception:
                          continue

                      if ts >= cutoff:
                          rows.append(row)

              return rows


          # ============================================================
          # DEDUPE
          #
          # Multiple redundant runners can probe the same provider/minute.
          #
          # Prefer:
          #   up
          #   rate_limited
          #   degraded
          #   timeout/down/etc
          #
          # An "up" result proves usable inference during that minute,
          # even if another overlapping runner saw a transient failure.
          # ============================================================

          QUALITY = {
              "up": 100,
              "rate_limited": 80,
              "degraded": 60,
              "down": 40,
              "timeout": 30,
              "auth_error": 20,
              "missing_secret": 10,
              "error": 0,
          }


          def dedupe(rows):
              slots = {}

              for row in rows:

                  key = (
                      row.get("provider"),
                      row.get("minute"),
                  )

                  previous = slots.get(key)

                  if previous is None:
                      slots[key] = row
                      continue

                  old_quality = QUALITY.get(
                      previous.get("status"),
                      0,
                  )

                  new_quality = QUALITY.get(
                      row.get("status"),
                      0,
                  )

                  if new_quality > old_quality:
                      slots[key] = row

                  elif new_quality == old_quality:

                      # Prefer lower successful latency.
                      old_latency = previous.get(
                          "latency_ms"
                      )

                      new_latency = row.get(
                          "latency_ms"
                      )

                      if (
                          isinstance(
                              new_latency,
                              (int, float)
                          )
                          and (
                              not isinstance(
                                  old_latency,
                                  (int, float)
                              )
                              or new_latency < old_latency
                          )
                      ):
                          slots[key] = row


              return sorted(
                  slots.values(),
                  key=lambda r: (
                      r.get("ts", ""),
                      r.get("provider", ""),
                  ),
              )


          rows = dedupe(
              load_raw(days=2)
          )


          # ============================================================
          # DAILY CANONICAL HISTORY
          # ============================================================

          grouped = {}

          for row in rows:

              dt = parse_ts(row["ts"])

              key = dt.strftime(
                  "%Y/%m/%d"
              )

              grouped.setdefault(
                  key,
                  []
              ).append(row)


          for day, day_rows in grouped.items():

              path = (
                  HISTORY
                  / f"{day}.jsonl"
              )

              path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              text = "".join(
                  json.dumps(
                      r,
                      separators=(",", ":"),
                      ensure_ascii=False,
                  )
                  + "\n"
                  for r in day_rows
              )

              path.write_text(
                  text,
                  encoding="utf-8"
              )


          # ============================================================
          # 24H DATA
          # ============================================================

          cutoff = (
              now()
              - timedelta(hours=24)
          )


          recent = [
              r
              for r in rows
              if parse_ts(r["ts"]) >= cutoff
          ]


          provider_ids = [
              "aihubmix",
              "unorouter",
              "orcarouter",
              "nvidia",
          ]


          # ============================================================
          # CURRENT
          # ============================================================

          latest = {}


          for pid in provider_ids:

              matches = [
                  r
                  for r in recent
                  if r.get("provider") == pid
              ]

              if matches:
                  latest[pid] = matches[-1]


          CURRENT.write_text(
              json.dumps(
                  {
                      "project": "InferencePulse",
                      "generated_at": iso(),
                      "providers": latest,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # SUMMARY
          # ============================================================

          def percentile(values, fraction):

              if not values:
                  return None

              values = sorted(values)

              i = round(
                  (len(values) - 1)
                  * fraction
              )

              return values[i]


          summary = {}


          for pid in provider_ids:

              entries = [
                  r
                  for r in recent
                  if r.get("provider") == pid
              ]


              up = [
                  r
                  for r in entries
                  if r.get("status") == "up"
              ]


              latency = [
                  r["latency_ms"]
                  for r in up
                  if isinstance(
                      r.get("latency_ms"),
                      (int, float)
                  )
              ]


              observed_minutes = {
                  r.get("minute")
                  for r in entries
                  if r.get("minute")
              }


              name = (
                  entries[-1].get("name")
                  if entries
                  else pid
              )


              model = (
                  entries[-1].get(
                      "requested_model"
                  )
                  if entries
                  else None
              )


              count = len(entries)


              summary[pid] = {
                  "name": name,
                  "model": model,

                  "checks": count,

                  "successful_checks":
                      len(up),

                  "success_pct": (
                      round(
                          len(up)
                          / count
                          * 100,
                          2,
                      )
                      if count
                      else None
                  ),

                  "rate_limited_checks":
                      sum(
                          1
                          for r in entries
                          if r.get("status")
                          == "rate_limited"
                      ),

                  "degraded_checks":
                      sum(
                          1
                          for r in entries
                          if r.get("status")
                          == "degraded"
                      ),

                  "timeout_checks":
                      sum(
                          1
                          for r in entries
                          if r.get("status")
                          == "timeout"
                      ),

                  "median_latency_ms":
                      percentile(
                          latency,
                          0.50
                      ),

                  "p95_latency_ms":
                      percentile(
                          latency,
                          0.95
                      ),

                  "observed_minutes":
                      len(observed_minutes),

                  "coverage_pct": round(
                      min(
                          100,
                          len(observed_minutes)
                          / 1440
                          * 100
                      ),
                      2
                  ),

                  "current_status": (
                      entries[-1].get("status")
                      if entries
                      else "unknown"
                  ),

                  "last_check": (
                      entries[-1].get("ts")
                      if entries
                      else None
                  ),
              }


          SUMMARY.write_text(
              json.dumps(
                  {
                      "project": "InferencePulse",
                      "window": "24h",
                      "generated_at": iso(),
                      "providers": summary,
                  },
                  indent=2,
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )


          # ============================================================
          # SIMPLE WEBSITE
          # ============================================================

          html = r'''<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>InferencePulse</title>

          <style>
          :root {
            color-scheme: dark;
            --bg:#090b10;
            --card:#121620;
            --border:#252b38;
            --text:#f5f7fb;
            --muted:#8f9bad;
            --green:#38d996;
            --yellow:#f4c95d;
            --red:#ff6678;
            --blue:#6ea8ff;
          }

          * { box-sizing:border-box; }

          body {
            margin:0;
            background:var(--bg);
            color:var(--text);
            font-family:
              Inter,
              ui-sans-serif,
              system-ui,
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              sans-serif;
          }

          main {
            width:min(1150px,calc(100% - 32px));
            margin:auto;
            padding:64px 0;
          }

          h1 {
            margin:0;
            font-size:clamp(40px,7vw,68px);
            letter-spacing:-.05em;
          }

          .subtitle {
            margin:12px 0 36px;
            color:var(--muted);
          }

          .overall,
          .card {
            border:1px solid var(--border);
            background:var(--card);
            border-radius:15px;
          }

          .overall {
            padding:18px 22px;
            margin-bottom:16px;
            font-weight:800;
          }

          .grid {
            display:grid;
            grid-template-columns:
              repeat(auto-fit,minmax(240px,1fr));
            gap:16px;
          }

          .card {
            padding:20px;
          }

          .head,
          .row {
            display:flex;
            justify-content:space-between;
            gap:14px;
          }

          .name {
            font-weight:850;
            font-size:18px;
          }

          .status {
            text-transform:uppercase;
            font-size:11px;
            font-weight:900;
            letter-spacing:.08em;
          }

          .up { color:var(--green); }
          .rate_limited,
          .degraded { color:var(--yellow); }
          .down,
          .timeout,
          .auth_error { color:var(--red); }

          .big {
            margin-top:22px;
            font-size:34px;
            font-weight:900;
          }

          .muted,
          .row span {
            color:var(--muted);
            font-size:13px;
          }

          .row {
            margin-top:12px;
          }

          code {
            display:block;
            margin-top:18px;
            color:var(--blue);
            overflow-wrap:anywhere;
            font-size:12px;
          }

          footer {
            margin-top:32px;
            color:var(--muted);
            font-size:12px;
          }
          </style>
          </head>

          <body>
          <main>

          <h1>InferencePulse</h1>

          <div class="subtitle">
            Minute-resolution availability monitoring for free
            GLM-5.3-Flash inference.
          </div>

          <div class="overall" id="overall">
            Loading…
          </div>

          <div class="grid" id="grid"></div>

          <footer id="footer"></footer>

          </main>

          <script>
          const e = x =>
            String(x ?? "—")
              .replaceAll("&","&amp;")
              .replaceAll("<","&lt;")
              .replaceAll(">","&gt;");

          async function load() {

            const stamp = Date.now();

            const [cr,sr] =
              await Promise.all([
                fetch(
                  `data/current.json?${stamp}`
                ),
                fetch(
                  `data/summary.json?${stamp}`
                )
              ]);

            const current =
              await cr.json();

            const summary =
              await sr.json();

            const ids =
              Object.keys(
                summary.providers || {}
              );

            const up =
              ids.filter(
                id =>
                  current.providers?.[id]
                    ?.status === "up"
              ).length;

            document.querySelector(
              "#overall"
            ).innerHTML =
              `<span class="${
                up === ids.length
                  ? "up"
                  : "degraded"
              }">${up}/${ids.length} currently up</span>`;


            document.querySelector(
              "#grid"
            ).innerHTML =
              ids.map(id => {

                const s =
                  summary.providers[id];

                const c =
                  current.providers?.[id] || {};

                return `
                <section class="card">

                  <div class="head">
                    <div class="name">
                      ${e(s.name)}
                    </div>

                    <div class="status ${e(c.status)}">
                      ${e(
                        (c.status || "unknown")
                          .replaceAll("_"," ")
                      )}
                    </div>
                  </div>

                  <div class="big">
                    ${
                      s.success_pct == null
                        ? "—"
                        : e(s.success_pct + "%")
                    }
                  </div>

                  <div class="muted">
                    successful inference · last 24h
                  </div>

                  <div class="row">
                    <span>Latest latency</span>
                    <strong>
                      ${
                        c.latency_ms == null
                          ? "—"
                          : e(c.latency_ms + " ms")
                      }
                    </strong>
                  </div>

                  <div class="row">
                    <span>Median</span>
                    <strong>
                      ${
                        s.median_latency_ms == null
                          ? "—"
                          : e(
                              s.median_latency_ms
                              + " ms"
                            )
                      }
                    </strong>
                  </div>

                  <div class="row">
                    <span>P95</span>
                    <strong>
                      ${
                        s.p95_latency_ms == null
                          ? "—"
                          : e(
                              s.p95_latency_ms
                              + " ms"
                            )
                      }
                    </strong>
                  </div>

                  <div class="row">
                    <span>Minute coverage</span>
                    <strong>
                      ${e(s.coverage_pct + "%")}
                    </strong>
                  </div>

                  <div class="row">
                    <span>Rate limited</span>
                    <strong>
                      ${e(s.rate_limited_checks)}
                    </strong>
                  </div>

                  <code>${e(s.model)}</code>

                </section>`;
              })
              .join("");


            document.querySelector(
              "#footer"
            ).textContent =
              "Updated " +
              new Date(
                current.generated_at
              ).toLocaleString();
          }

          load();

          setInterval(
            load,
            60_000
          );
          </script>

          </body>
          </html>
          '''


          (ROOT / "index.html").write_text(
              html,
              encoding="utf-8"
          )
          PY

          python /tmp/inferencepulse_publish.py

      - name: Commit merged heartbeat data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "InferencePulse Bot"
          git config user.email "inferencepulse@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit \
            -m "pulse: run ${{ github.run_id }}"

          # Publisher is serialized, but refresh once more just in case
          # some unrelated human commit landed.
          for attempt in 1 2 3; do

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; rebasing and retrying..."

            git pull --rebase origin main

            sleep 2
          done

          echo "Could not push after retries."
          exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment
        run: |
          echo "InferencePulse:"
          echo "${{ steps.deployment.outputs.page_url }}"
